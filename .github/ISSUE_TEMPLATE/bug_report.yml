name: Bug Report
description: Report a bug with an extension
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: extension
    attributes:
      label: Extension Name
      description: Which extension has the bug?
      placeholder: "e.g., trivy, cilium"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What version of the extension?
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: "Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Install extension
        2. Run command
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant logs?
      render: shell
    validations:
      required: false
